name: Validate theme

on:
  push:
    branches:
      - main
      - shareable-theme-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate source and ZIP
        run: pnpm verify

      - name: Create checksum
        run: sha256sum dist/gpt-ghost-theme.zip > dist/gpt-ghost-theme.zip.sha256

      - name: Upload validated beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpt-ghost-theme-${{ github.sha }}
          path: |
            dist/gpt-ghost-theme.zip
            dist/gpt-ghost-theme.zip.sha256
            routes.yaml
          if-no-files-found: error
          retention-days: 14
